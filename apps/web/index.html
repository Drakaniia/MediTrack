<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta
      content="width=device-width, initial-scale=1, viewport-fit=cover"
      name="viewport"
    >
    <meta content="dark light" name="color-scheme">
    <meta
      content="#f5f5f5"
      media="(prefers-color-scheme: light)"
      name="theme-color"
    >
    <meta
      content="#141414"
      media="(prefers-color-scheme: dark)"
      name="theme-color"
    >
    <meta
      content="Medical supply expiry tracking and first-expiry, first-out (FEFO) dispensing for clinics."
      name="description"
    >
    <title>MediTract</title>
    <link href="/manifest.webmanifest" rel="manifest">
    <link href="/favicon.png" rel="icon" type="image/png">
    <link href="/icons/apple-touch-icon.png" rel="apple-touch-icon">
    <!-- Pre-paint theme/density sync. A same-origin file, not an inline script:
         the CSP is `script-src 'self'`. It must stay synchronous so the first
         paint already has the right theme. -->
    <script src="/theme-init.js"></script>
  </head>

  <body>
    <div id="app"></div>
    <noscript
      >MediTract needs JavaScript. Enable it in your browser to
      continue.</noscript
    >
    <script src="/src/main.tsx" type="module"></script>
  </body>
</html>
