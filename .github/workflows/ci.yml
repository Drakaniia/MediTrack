name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # A local action is resolved from the workspace, so the repo must be
      # checked out before ./... resolves. The checkout inside the composite
      # action is too late to help.
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm run lint

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # A local action is resolved from the workspace, so the repo must be
      # checked out before ./... resolves. The checkout inside the composite
      # action is too late to help.
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm run check-types

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # A local action is resolved from the workspace, so the repo must be
      # checked out before ./... resolves. The checkout inside the composite
      # action is too late to help.
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm run test

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [typecheck]
    steps:
      # A local action is resolved from the workspace, so the repo must be
      # checked out before ./... resolves. The checkout inside the composite
      # action is too late to help.
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm run build